services:
  db:  #i have just one container i want to run
    image: postgres:16 #this is a blueprint of a piece of software in this case postgres(16 is the version of postgres)
    restart: unless-stopped #make ssure that if the container fails it will always restart
    env_file:
      - .env.docker
    # The app code hardcodes `ssl: 'require'` for every DB connection, so the
    # server must offer TLS or every query (including /seed) fails to connect.
    # This generates a fresh self-signed cert on every start (kept out of the
    # named volume on purpose) and hands it to Postgres before it starts listening.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /var/lib/postgresql/certs
        openssl req -new -x509 -days 3650 -nodes -subj "/CN=localhost" \
          -out /var/lib/postgresql/certs/server.crt \
          -keyout /var/lib/postgresql/certs/server.key
        chown postgres:postgres /var/lib/postgresql/certs/server.crt /var/lib/postgresql/certs/server.key
        chmod 600 /var/lib/postgresql/certs/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/certs/server.crt \
          -c ssl_key_file=/var/lib/postgresql/certs/server.key
    ports :
      - "5432:5432" #maps port 5432 on your machine to port 5432 inside the container (Postgres's default port)
    volumes:
      - nextJsProject:/var/lib/postgresql/data #Volume is a persistent storage on your host machine that a container can read/write to, so the data survives even when the container is destroyed.

volumes:
  nextJsProject: #decalarion of the volume